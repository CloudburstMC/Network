name: External signalling conformance
on:
  push:
    branches:
      - 'develop'
      - 'nethernet'
  pull_request:
    branches:
      - 'develop'
      - 'nethernet'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify canonical protocol fixtures
        run: node docs/external-signalling/fixtures.mjs
      - name: Validate transport against the published native
        run: ./gradlew --max-workers=2 build
      - name: Build the native chain the published binding records
        run: |
          set -o pipefail
          bash scripts/bootstrap-native-admission.sh | tee bootstrap.log
          grep -E '^native(MavenRepository|JavaVersion)=' bootstrap.log >> "$GITHUB_ENV"
      - name: Validate independent provider against that chain
        run: |
          ./gradlew --max-workers=2 :external-signalling:nativeAdmissionTest \
            -PnativeMavenRepository="$nativeMavenRepository" \
            -PnativeJavaVersion="$nativeJavaVersion"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nxs-conformance
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            .native-deps/maven/**/provenance.json
